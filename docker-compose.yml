version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - API_SECRET=${API_SECRET:-change-me-123}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
  redisdata:
